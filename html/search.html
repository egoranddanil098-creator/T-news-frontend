<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>T-News</title>
    <link rel="stylesheet" href="../css/search.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header">
      <div class="header-container">
        <div class="logo">
          <div class="logo-icon">
            <a href="main.html"><img src="../img/icon.svg" alt="" /></a>
          </div>
          <input
            type="text"
            placeholder="Поиск по T-News"
            class="search-input"
          />
        </div>

        <div class="links">
          <div class="register">
            <a href="register.html" class="register-link">
              <p>Зарегистрироваться</p>
              <img src="../img/arrow-in-right.svg" alt="register icon" />
            </a>
          </div>
          <div class="login">
            <a href="login.html" class="register-link">
              <p>Войти</p>
              <img src="../img/arrow-in-right.svg" alt="register icon" />
            </a>
          </div>
        </div>

        <div class="user-menu">
          <div class="logout">
            <button class="logout-button">
              <p>Выйти</p>
              <img src="../img/arrow-in-right.svg" alt="logout icon" />
            </button>
          </div>
          <div class="profile">
            <a href="profile.html" class="profile-link">
              <img src="../img/profile.svg" alt="profile icon" />
            </a>
          </div>
        </div>
      </div>
    </header>

    <main class="content">
      <div class="search-buttons">
        <button class="search-btn active">Пользователи</button>
        <button class="search-btn">Посты</button>
      </div>

      <div class="result-search">
        <div class="searched-users">
          <div class="searched-user author"></div>
        </div>
        <div class="searched-posts"></div>
      </div>
    </main>

    <script type="module" src="../js/pages/search.js"></script>
  </body>
</html>
