<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>T-News SighUp</title>
    <link rel="stylesheet" href="../css/forms.css" />
  </head>
  <body>
    <header class="header">
      <div class="header-container">
        <div class="logo">
          <div class="logo-icon"><img src="../img/icon.svg" alt="" /></div>
        </div>
      </div>
    </header>

    <main class="form-container">
      <h1>Регистрация</h1>

      <input type="text" placeholder="Логин" class="input-login" />
      <input type="password" placeholder="Пароль" class="input-password" />
      <input
        type="password"
        placeholder="Повторите пароль"
        class="input-repeat-password"
      />

      <div class="buttons">
        <button class="btn-login gray">Войти</button>
        <button class="btn-register yellow">Зарегистрироваться</button>
      </div>
    </main>

    <script type="module" src="../js/pages/register.js"></script>
  </body>
</html>
